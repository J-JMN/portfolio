<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title">
  <title id="title">Start a project with INTAVOR</title>
  
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b1220"/>
        <stop offset="0.58" stop-color="#111d2e"/>
        <stop offset="1" stop-color="#17152e"/>
      </linearGradient>
      <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.35" stop-color="#f8f7ff"/>
        <stop offset="0.72" stop-color="#a99cff"/>
        <stop offset="1" stop-color="#7a6cff"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#a99cff"/>
        <stop offset="1" stop-color="#7a6cff"/>
      </linearGradient>
      <radialGradient id="glow">
        <stop offset="0" stop-color="#7a6cff" stop-opacity="0.38"/>
        <stop offset="1" stop-color="#7a6cff" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
      </filter>
    </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  
      
    <text x="82" y="98" fill="#a99cff" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">YOUR NEXT STEP</text>
    <text x="998" y="98" text-anchor="end" fill="#b5bfce" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">09</text>
    <line x1="82" y1="132" x2="998" y2="132" stroke="#344157" stroke-width="2"/>
      <circle cx="882" cy="340" r="300" fill="url(#glow)"/>
      <text x="82" y="320" fill="#f5f5f6" font-family="Arial, sans-serif" font-size="78" font-weight="700">
        <tspan x="82">Is your website</tspan>
        <tspan x="82" dy="86">working as hard</tspan>
        <tspan x="82" dy="86">as your business?</tspan>
      </text>
      <text x="82" y="660" fill="#b5bfce" font-family="Arial, sans-serif" font-size="31">
        <tspan x="82">Whether you need a new platform, reliable</tspan>
        <tspan x="82" dy="46">support or focused improvements—we can help.</tspan>
      </text>
      <rect x="82" y="810" width="594" height="104" rx="52" fill="url(#accent)"/>
      <text x="379" y="876" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="31" font-weight="700">DISCUSS YOUR WEBSITE  →</text>
      <text x="82" y="1002" fill="#f5f5f6" font-family="Arial, sans-serif" font-size="27">intavor.co.ke/contact</text>
      <text x="82" y="1052" fill="#b5bfce" font-family="Arial, sans-serif" font-size="24">contact@intavor.co.ke</text>
      <g transform="translate(750 838) scale(0.35561877667140823)" opacity="0.42"><path d="M 0,338 L 304,19 Q 331,-8 359,20 L 599,248 L 599,52 Q 599,6 645,6 L 703,6 L 703,157 Q 703,180 684,202 L 540,339 Q 518,360 497,338 L 283,126 Q 256,100 236,124 Q 229,133 228,161 L 226,254 Q 220,338 135,338 Z" fill="url(#mark)"/></g>
      
    <line x1="82" y1="1230" x2="998" y2="1230" stroke="#344157" stroke-width="2"/>
    
    <g transform="translate(82 1260) scale(0.08603129445234708)" opacity="1"><path d="M 0,338 L 304,19 Q 331,-8 359,20 L 599,248 L 599,52 Q 599,6 645,6 L 703,6 L 703,157 Q 703,180 684,202 L 540,339 Q 518,360 497,338 L 283,126 Q 256,100 236,124 Q 229,133 228,161 L 226,254 Q 220,338 135,338 Z" fill="url(#mark)"/></g>
    <text x="157.6" y="1284.48" fill="#f5f5f6" font-family="Arial, sans-serif" font-size="20.16" font-weight="700" letter-spacing="5.04">INTAVOR</text>
    <text x="998" y="1295" text-anchor="end" fill="#b5bfce" font-family="Arial, sans-serif" font-size="22">intavor.co.ke</text>
    
</svg>
