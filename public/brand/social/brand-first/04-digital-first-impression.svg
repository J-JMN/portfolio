<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title">
  <title id="title">Your website is often your first impression</title>
  
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b1220"/>
        <stop offset="0.58" stop-color="#111d2e"/>
        <stop offset="1" stop-color="#17152e"/>
      </linearGradient>
      <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.35" stop-color="#f8f7ff"/>
        <stop offset="0.72" stop-color="#a99cff"/>
        <stop offset="1" stop-color="#7a6cff"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#a99cff"/>
        <stop offset="1" stop-color="#7a6cff"/>
      </linearGradient>
      <radialGradient id="glow">
        <stop offset="0" stop-color="#7a6cff" stop-opacity="0.38"/>
        <stop offset="1" stop-color="#7a6cff" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
      </filter>
    </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  
      
    <text x="82" y="98" fill="#a99cff" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">A SIMPLE TRUTH</text>
    <text x="998" y="98" text-anchor="end" fill="#b5bfce" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">04 / 12</text>
    <line x1="82" y1="132" x2="998" y2="132" stroke="#344157" stroke-width="2"/>
      <circle cx="850" cy="350" r="310" fill="url(#glow)"/>
      <text x="82" y="334" fill="#f5f5f6" font-family="Arial, sans-serif" font-size="82" font-weight="700">
        <tspan x="82">Your website is</tspan>
        <tspan x="82" dy="92">often your first</tspan>
        <tspan x="82" dy="92" fill="#a99cff">impression.</tspan>
      </text>
      <rect x="82" y="690" width="916" height="270" rx="30" fill="#152132" stroke="#344157" stroke-width="2"/>
      <text x="132" y="775" fill="#b5bfce" font-family="Arial, sans-serif" font-size="26">BEFORE SOMEONE CALLS, EMAILS OR VISITS—</text>
      <text x="132" y="852" fill="#f5f5f6" font-family="Arial, sans-serif" font-size="38" font-weight="600">
        <tspan x="132">your website has already said something</tspan>
        <tspan x="132" dy="52">about your business.</tspan>
      </text>
      <text x="82" y="1066" fill="#a99cff" font-family="Arial, sans-serif" font-size="28">Make that first impression intentional.</text>
      
    <line x1="82" y1="1230" x2="998" y2="1230" stroke="#344157" stroke-width="2"/>
    
    <g transform="translate(82 1260) scale(0.08603129445234708)" opacity="1"><path d="M 0,338 L 304,19 Q 331,-8 359,20 L 599,248 L 599,52 Q 599,6 645,6 L 703,6 L 703,157 Q 703,180 684,202 L 540,339 Q 518,360 497,338 L 283,126 Q 256,100 236,124 Q 229,133 228,161 L 226,254 Q 220,338 135,338 Z" fill="url(#mark)"/></g>
    <text x="157.6" y="1284.48" fill="#f5f5f6" font-family="Arial, sans-serif" font-size="20.16" font-weight="700" letter-spacing="5.04">INTAVOR</text>
    <text x="998" y="1295" text-anchor="end" fill="#b5bfce" font-family="Arial, sans-serif" font-size="22">intavor.co.ke</text>
    
</svg>
