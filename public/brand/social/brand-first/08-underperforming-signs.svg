<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title">
  <title id="title">Three signs a website may be underperforming</title>
  
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b1220"/>
        <stop offset="0.58" stop-color="#111d2e"/>
        <stop offset="1" stop-color="#17152e"/>
      </linearGradient>
      <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.35" stop-color="#f8f7ff"/>
        <stop offset="0.72" stop-color="#a99cff"/>
        <stop offset="1" stop-color="#7a6cff"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#a99cff"/>
        <stop offset="1" stop-color="#7a6cff"/>
      </linearGradient>
      <radialGradient id="glow">
        <stop offset="0" stop-color="#7a6cff" stop-opacity="0.38"/>
        <stop offset="1" stop-color="#7a6cff" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
      </filter>
    </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  
      
    <text x="82" y="98" fill="#a99cff" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">WEBSITE CHECK</text>
    <text x="998" y="98" text-anchor="end" fill="#b5bfce" font-family="Arial, sans-serif" font-size="22" letter-spacing="3">08 / 12</text>
    <line x1="82" y1="132" x2="998" y2="132" stroke="#344157" stroke-width="2"/>
      <text x="82" y="252" fill="#f5f5f6" font-family="Arial, sans-serif" font-size="67" font-weight="700">
        <tspan x="82">Three signs your website</tspan>
        <tspan x="82" dy="76" fill="#a99cff">may be underperforming.</tspan>
      </text>
      <g transform="translate(82 434)">
        <rect width="916" height="174" rx="24" fill="#152132" stroke="#344157" stroke-width="2"/>
        <text x="42" y="77" fill="#a99cff" font-family="Arial, sans-serif" font-size="56" font-weight="700">01</text>
        <text x="146" y="70" fill="#f5f5f6" font-family="Arial, sans-serif" font-size="35" font-weight="700">Your offer is difficult to understand.</text>
        <text x="146" y="119" fill="#b5bfce" font-family="Arial, sans-serif" font-size="24">Visitors should not have to decode what you do.</text>
      </g>
      <g transform="translate(82 640)">
        <rect width="916" height="174" rx="24" fill="#152132" stroke="#344157" stroke-width="2"/>
        <text x="42" y="77" fill="#a99cff" font-family="Arial, sans-serif" font-size="56" font-weight="700">02</text>
        <text x="146" y="70" fill="#f5f5f6" font-family="Arial, sans-serif" font-size="35" font-weight="700">Mobile visitors struggle to use it.</text>
        <text x="146" y="119" fill="#b5bfce" font-family="Arial, sans-serif" font-size="24">Small screens should never feel like an afterthought.</text>
      </g>
      <g transform="translate(82 846)">
        <rect width="916" height="174" rx="24" fill="#152132" stroke="#344157" stroke-width="2"/>
        <text x="42" y="77" fill="#a99cff" font-family="Arial, sans-serif" font-size="56" font-weight="700">03</text>
        <text x="146" y="70" fill="#f5f5f6" font-family="Arial, sans-serif" font-size="35" font-weight="700">Enquiries are hard to complete.</text>
        <text x="146" y="119" fill="#b5bfce" font-family="Arial, sans-serif" font-size="24">Every unnecessary step creates another exit point.</text>
      </g>
      
    <line x1="82" y1="1230" x2="998" y2="1230" stroke="#344157" stroke-width="2"/>
    
    <g transform="translate(82 1260) scale(0.08603129445234708)" opacity="1"><path d="M 0,338 L 304,19 Q 331,-8 359,20 L 599,248 L 599,52 Q 599,6 645,6 L 703,6 L 703,157 Q 703,180 684,202 L 540,339 Q 518,360 497,338 L 283,126 Q 256,100 236,124 Q 229,133 228,161 L 226,254 Q 220,338 135,338 Z" fill="url(#mark)"/></g>
    <text x="157.6" y="1284.48" fill="#f5f5f6" font-family="Arial, sans-serif" font-size="20.16" font-weight="700" letter-spacing="5.04">INTAVOR</text>
    <text x="998" y="1295" text-anchor="end" fill="#b5bfce" font-family="Arial, sans-serif" font-size="22">intavor.co.ke</text>
    
</svg>
